[project]
name = "mini-rag"
version = "0.1.0"
description = "A small, fully local RAG application: Ollama + ChromaDB + prompt_toolkit."
readme = "README.md"
authors = [
    { name = "Qazi Sami ur Rahman", email = "qsrahmans@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "ollama>=0.6.3",
    "prompt-toolkit>=3.0.53",
    "pymupdf>=2.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.0",
]

[project.scripts]
mini-rag = "mini_rag.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live'"
markers = ["live: needs a running Ollama with the default models (run with: pytest -m live)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]
